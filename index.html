<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Task Board</h1>
            <p>Organise and track your project tasks.</p>
            <button type="button" id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false">
                <span>Dark mode</span>
                <span class="theme-track" aria-hidden="true"></span>
            </button>
            <p id="theme-message" role="status" hidden></p>
        </header>
        <!-- Creation Form -->
        <main>
            <section class="controls-section">
                <form id="task-form" class="task-form">
                    <div class="form-field">
                        <input type="text" id="task-title" aria-label="Task title" name="title"
                            placeholder="Create task here:" required>
                    </div>

                    <div class="form-field">
                        <textarea id="task-description" aria-label="Task description" name="description" rows="3"
                            placeholder="Additional information:"></textarea>
                    </div>

                    <div class="form-field">
                        <select id="task-category" aria-label="Task category" required name="category">
                            <option value="" disabled selected>Select a category</option>
                            <option value="Development">Development</option>
                            <option value="Design">Design</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <select id="task-priority" aria-label="Task priority" required name="priority">
                            <option value="" disabled selected>Select a priority</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Task</button>
                </form>
            </section>

            <!-- Search and filters -->
                <div class="filter-bar">
                    <div class="form-field">
                        <input type="search" id="search-input" aria-label="Search tasks by title" placeholder="Search tasks...">
                    </div>

                    <div class="form-field">
                        <select id="category-filter" aria-label="Filter tasks by category">
                            <option value="All">All Categories</option>
                            <option value="Development">Development</option>
                            <option value="Design">Design</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                </div>

            <p id="storage-message" class="storage-message" role="alert" hidden></p>
            <p id="results-message" class="results-message" role="status" aria-live="polite"></p>
            <!-- Task board -->
            <div class="board-container">
                <section class="column" data-status="todo" aria-labelledby="todo-heading">
                    <h2 id="todo-heading">To Do</h2>
                    <div class="task-list" id="list-todo"></div>
                </section>

                <section class="column" data-status="in-progress" aria-labelledby="progress-heading">
                    <h2 id="progress-heading">In Progress</h2>
                    <div class="task-list" id="list-in-progress"></div>
                </section>

                <section class="column" data-status="completed" aria-labelledby="completed-heading">
                    <h2 id="completed-heading">Completed</h2>
                    <div class="task-list" id="list-completed"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
